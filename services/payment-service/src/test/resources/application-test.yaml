spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/mock-jwks

payment:
  va-expiry: 15m
  reconciliation:
    # Besar sengaja: job penjadwalan tidak boleh ikut jalan saat test (dipicu manual di unit test).
    scan-rate: 3600000
    grace: 5m

midtrans:
  base-url: http://localhost:9999
  connect-timeout: 3s
  read-timeout: 5s
  server-key: SB-Mid-server-DUMMYKEYFORLOCAL0000

resilience4j:
  circuitbreaker:
    instances:
      midtrans:
        slidingWindowSize: 3
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 500ms
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - com.takapedia.payment.exception.MidtransClient4xxException