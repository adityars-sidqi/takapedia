spring:
  application:
    name: payment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth Service menerbitkan JWKS (sama seperti Order Service)
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      # TTL pendek: status payment berubah-ubah & sering di-poll. Batasi staleness.
      time-to-live: 10s

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: takapedia
    password: takapedia_dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

payment:
  # Umur VA yang kita dikte ke Midtrans (custom_expiry). expiry_time di response yang disimpan.
  va-expiry: 15m
  reconciliation:
    # Cadence job pemindai (milidetik) — dibaca oleh @Scheduled fixedDelayString.
    scan-rate: 60000
    # Buffer sebelum job berani men-EXPIRED (job = jaring pengaman, webhook = sinyal utama).
    grace: 5m
  outbox:
    # Cadence relay outbox → Kafka (milidetik).
    relay-rate: 2000

midtrans:
  base-url: http://localhost:8091
  connect-timeout: 3s
  read-timeout: 5s
  server-key: SB-Mid-server-DUMMYKEYFORLOCAL0000

management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      midtrans:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.takapedia.payment.exception.MidtransClient4xxException